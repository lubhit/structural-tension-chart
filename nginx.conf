server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Vite content-hashes asset filenames, so these are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated, otherwise browsers can keep
    # serving a stale build that points at old (or removed) asset hashes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
