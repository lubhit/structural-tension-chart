<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Tekton CI/CD architecture for tension-tool</title>
  <desc id="desc">CI/CD flow from developer push to Cloud Run deploy, with end users authenticating via Microsoft Entra ID. Includes local workstation paths.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b6470"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .box-title { font-size: 14px; font-weight: 600; fill: #0f172a; }
    .box-sub { font-size: 11px; fill: #64748b; }
    .label { font-size: 11px; fill: #475569; font-weight: 500; }
    .group-label { font-size: 12px; font-weight: 700; fill: #1f6feb; letter-spacing: 0.5px; }
    .pipeline-step { font-size: 11px; fill: #0f172a; font-weight: 500; }
    .step-num { font-size: 10px; fill: #64748b; font-weight: 600; }
    .machine-tag { font-size: 10px; fill: #1f6feb; font-weight: 700; letter-spacing: 0.3px; }
    .path { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; fill: #475569; }
  </style>

  <text x="550" y="34" text-anchor="middle" class="title">Tekton CI/CD → Cloud Run</text>
  <text x="550" y="56" text-anchor="middle" class="subtitle">git push triggers an end-to-end build and deploy</text>

  <!-- ============ LOCAL WORKSTATION (top left) ============ -->
  <g transform="translate(40, 90)">
    <rect width="340" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="14" y="20" class="group-label" fill="#475569">LOCAL WORKSTATION</text>

    <!-- Ford laptop -->
    <g transform="translate(14, 32)">
      <rect width="312" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" class="machine-tag">FORD LAPTOP · H2GQGQJ2RD (current)</text>
      <text x="10" y="32" class="path">~/Code/structural-tension-chart</text>
    </g>

    <!-- Personal Mac -->
    <g transform="translate(14, 76)">
      <rect width="312" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" class="machine-tag" fill="#64748b">PERSONAL MAC · MGC1GQGQJ2RD (yesterday)</text>
      <text x="10" y="32" class="path">~/structural-tension-chart  (verify path)</text>
    </g>
  </g>

  <!-- Developer (smaller, to the right of workstation) -->
  <g transform="translate(40, 230)">
    <rect width="120" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="26" text-anchor="middle" class="box-title">Developer</text>
    <text x="60" y="42" text-anchor="middle" class="box-sub">git push origin main</text>
  </g>

  <!-- Arrow workstation -> developer (visual aid) -->
  <line x1="210" y1="210" x2="100" y2="230" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Arrow: dev -> github -->
  <line x1="160" y1="260" x2="220" y2="260" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GitHub -->
  <g transform="translate(220, 230)">
    <rect width="140" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" class="box-title">GitHub</text>
    <text x="70" y="38" text-anchor="middle" class="box-sub">lubhit/structural-…</text>
    <text x="70" y="52" text-anchor="middle" class="box-sub">push webhook</text>
  </g>

  <!-- Arrow: github -> EL -->
  <line x1="360" y1="260" x2="420" y2="260" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="252" text-anchor="middle" class="label">HMAC</text>

  <!-- ============ GKE CLUSTER ============ -->
  <g transform="translate(420, 200)">
    <rect width="540" height="380" rx="14" fill="#eff6ff" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="20" y="24" class="group-label">GKE CLUSTER · tekton-ci · us-central1-a</text>

    <g transform="translate(20, 40)">
      <rect width="160" height="70" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/>
      <text x="80" y="28" text-anchor="middle" class="box-title">EventListener</text>
      <text x="80" y="46" text-anchor="middle" class="box-sub">LoadBalancer :8080</text>
      <text x="80" y="60" text-anchor="middle" class="box-sub">verifies HMAC</text>
    </g>

    <line x1="100" y1="135" x2="100" y2="170" stroke="#1f6feb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="115" y="158" class="label">creates</text>

    <g transform="translate(20, 175)">
      <rect width="500" height="180" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/>
      <text x="20" y="22" class="group-label" font-size="11">PIPELINERUN · tension-tool-build-deploy</text>

      <g transform="translate(20, 40)">
        <rect width="140" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="14" class="step-num">1</text>
        <text x="70" y="32" text-anchor="middle" class="pipeline-step">git-clone</text>
        <text x="70" y="48" text-anchor="middle" class="box-sub">Tekton catalog</text>
      </g>

      <line x1="160" y1="70" x2="180" y2="70" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arrow)"/>

      <g transform="translate(180, 40)">
        <rect width="140" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="14" class="step-num">2</text>
        <text x="70" y="32" text-anchor="middle" class="pipeline-step">kaniko build</text>
        <text x="70" y="48" text-anchor="middle" class="box-sub">Dockerfile → image</text>
      </g>

      <line x1="320" y1="70" x2="340" y2="70" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arrow)"/>

      <g transform="translate(340, 40)">
        <rect width="140" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="14" class="step-num">3</text>
        <text x="70" y="32" text-anchor="middle" class="pipeline-step">gcloud-run-deploy</text>
        <text x="70" y="48" text-anchor="middle" class="box-sub">custom Task</text>
      </g>

      <text x="20" y="135" class="label">Workload Identity:</text>
      <text x="20" y="150" class="box-sub">KSA tekton-deployer ↔ GSA tekton-deployer@…iam.gserviceaccount.com</text>
      <text x="20" y="165" class="box-sub">→ run.admin, artifactregistry.writer, iam.serviceAccountUser</text>
    </g>
  </g>

  <path d="M 670 415 L 670 650" stroke="#5b6470" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="680" y="540" class="label">push image</text>

  <path d="M 830 415 L 830 650" stroke="#5b6470" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="840" y="540" class="label">deploy revision</text>

  <!-- Artifact Registry -->
  <g transform="translate(580, 650)">
    <rect width="180" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" class="box-title">Artifact Registry</text>
    <text x="90" y="50" text-anchor="middle" class="box-sub">tension-app repo</text>
    <text x="90" y="64" text-anchor="middle" class="box-sub">us-central1</text>
  </g>

  <line x1="760" y1="690" x2="780" y2="690" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="682" text-anchor="middle" class="label">image ref</text>

  <!-- Cloud Run -->
  <g transform="translate(780, 650)">
    <rect width="200" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="100" y="30" text-anchor="middle" class="box-title">Cloud Run</text>
    <text x="100" y="50" text-anchor="middle" class="box-sub">tension-tool</text>
    <text x="100" y="64" text-anchor="middle" class="box-sub">tension-tool-…run.app</text>
  </g>

  <!-- End user -->
  <g transform="translate(40, 650)">
    <rect width="120" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="30" text-anchor="middle" class="box-title">End user</text>
    <text x="60" y="50" text-anchor="middle" class="box-sub">browser</text>
  </g>

  <path d="M 160 690 Q 400 690 780 690" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="400" y="680" text-anchor="middle" class="label" fill="#16a34a">opens app</text>

  <!-- Microsoft Entra ID -->
  <g transform="translate(220, 760)">
    <rect width="200" height="50" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" class="box-title">Microsoft Entra ID</text>
    <text x="100" y="40" text-anchor="middle" class="box-sub">SPA · personal MSA</text>
  </g>

  <path d="M 100 730 L 100 785 L 220 785" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="110" y="755" class="label" fill="#4f46e5">login</text>

  <path d="M 880 730 L 880 785 L 420 785" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="650" y="778" text-anchor="middle" class="label" fill="#4f46e5">redirect URI: https://tension-tool-…run.app</text>

  <!-- Legend -->
  <g transform="translate(220, 380)">
    <text x="0" y="0" class="group-label">LEGEND</text>
    <line x1="0" y1="20" x2="30" y2="20" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="38" y="24" class="box-sub">CI/CD flow</text>
    <line x1="0" y1="42" x2="30" y2="42" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
    <text x="38" y="46" class="box-sub">user traffic</text>
    <line x1="0" y1="64" x2="30" y2="64" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
    <text x="38" y="68" class="box-sub">auth flow</text>
  </g>
</svg>
